name: cluster-platform-local

x-platform-env: &platform-env
  PLATFORM_DATABASE_URL: postgresql+psycopg://platform:platform@postgres:5432/platform
  PLATFORM_RABBITMQ_URL: amqp://platform:platform@rabbitmq:5672//
  PLATFORM_OIDC_ISSUER: http://localhost:8081/realms/platform
  PLATFORM_OIDC_JWKS_URL: http://keycloak:8080/realms/platform/protocol/openid-connect/certs
  PLATFORM_OIDC_AUDIENCE: cluster-platform
  PLATFORM_MANAGEMENT_CLUSTER: local-mgmt

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: platform
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --hostname=http://localhost:8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes:
      - ./dev/keycloak/realm.json:/opt/keycloak/data/import/platform-realm.json:ro

  migrate:
    build: .
    command: alembic upgrade head
    environment: *platform-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  bootstrap:
    build: .
    command: python -m platform_service.infrastructure.bootstrap
    environment: *platform-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
    restart: "no"

  api:
    build: .
    ports: ["8000:8000"]
    environment: *platform-env
    depends_on:
      bootstrap: {condition: service_completed_successfully}

  outbox:
    build: .
    command: python -m platform_service.workers.outbox
    environment: *platform-env
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  executor:
    build: .
    command: >-
      sh -c "python -m platform_service.workers.heartbeat &
      exec celery -A platform_service.workers.tasks.celery_app worker
      -Q local-mgmt --loglevel=INFO --hostname=executor@%h"
    environment: *platform-env
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  fake-observer:
    build: .
    command: python -m platform_service.workers.fake_observer
    environment: *platform-env
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    command: celery --broker=amqp://platform:platform@rabbitmq:5672// flower --port=5555
    ports: ["5555:5555"]
    depends_on:
      rabbitmq: {condition: service_healthy}

volumes:
  postgres-data: {}
  rabbitmq-data: {}
